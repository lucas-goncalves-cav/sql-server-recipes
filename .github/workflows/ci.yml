name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Run every script against SQL Server
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPipeline_2026!' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPipeline_2026!' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Apply schema and seed
        run: |
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i setup/01-schema.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i setup/02-seed.sql

      - name: Run every recipe
        run: |
          failures=0

          while IFS= read -r script; do
            output="$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i "$script" 2>&1)"

            if echo "$output" | grep -qE '^Msg [0-9]+'; then
              echo "::error file=$script::Script failed"
              echo "$output" | grep -E '^Msg [0-9]+' -A1 | head -6
              failures=$((failures + 1))
            else
              echo "PASS $script"
            fi
          done < <(find . -name '*.sql' -not -path './setup/*' | sort)

          echo
          if [ "$failures" -gt 0 ]; then
            echo "$failures script(s) failed."
            exit 1
          fi

          echo "All scripts executed successfully."
