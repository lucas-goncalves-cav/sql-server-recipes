name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Run every script against SQL Server
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPipeline_2026!' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    env:
      SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPipeline_2026!' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -fsSL -o sqlcmd.tar.bz2 \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
          mkdir -p "$HOME/.local/bin"
          tar -xjf sqlcmd.tar.bz2 -C "$HOME/.local/bin" sqlcmd
          chmod +x "$HOME/.local/bin/sqlcmd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 40); do
            if sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 3
          done

          echo "SQL Server did not become ready in time."
          exit 1

      - name: Apply schema and seed
        run: |
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i setup/01-schema.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i setup/02-seed.sql

      - name: Run every recipe
        run: |
          failures=0

          while IFS= read -r script; do
            output="$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i "$script" 2>&1)"

            if echo "$output" | grep -qE '^Msg [0-9]+'; then
              echo "::error file=$script::Script failed"
              echo "$output" | grep -E '^Msg [0-9]+' -A1 | head -6
              failures=$((failures + 1))
            else
              echo "PASS $script"
            fi
          done < <(find . -name '*.sql' -not -path './setup/*' | sort)

          echo
          if [ "$failures" -gt 0 ]; then
            echo "$failures script(s) failed."
            exit 1
          fi

          echo "All scripts executed successfully."
